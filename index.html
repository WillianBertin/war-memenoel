<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAR MEMENOEL 3D — Direct Play</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020308;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: 800px;
      border: 2px solid rgba(0, 243, 255, 0.75);
      border-radius: 20px;
      overflow: hidden;
      background: #03040a;
      box-shadow: 0 0 80px rgba(0, 243, 255, 0.35), 0 0 140px rgba(255, 0, 85, 0.25);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 14px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      background: rgba(8, 13, 28, 0.78);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 22px;
      border: 1px solid rgba(0, 243, 255, 0.45);
    }
    .bar-wrap {
      width: 72px;
      height: 9px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: inline-block;
      vertical-align: middle;
      margin-left: 5px;
    }
    #hud-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      transition: width 0.15s ease;
    }
    #hud-ult-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff8800, #ffee00);
      transition: width 0.15s ease;
    }
    #boss-hud {
      margin-top: 10px;
      background: rgba(20, 5, 15, 0.85);
      border: 1px solid #ff0055;
      border-radius: 14px;
      padding: 8px 14px;
      text-align: center;
    }
    #boss-name {
      font-size: 12px;
      font-weight: 900;
      color: #ffcc00;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }
    .boss-bar-bg {
      width: 100%;
      height: 10px;
      background: #1a0510;
      border-radius: 5px;
      overflow: hidden;
    }
    #boss-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #ffaa00);
      transition: width 0.1s linear;
    }
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #combo-badge {
      background: linear-gradient(135deg, #ff0055, #ff7700);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #btn-ult {
      pointer-events: auto;
      background: linear-gradient(135deg, #ffaa00, #ff0055);
      border: 2px solid #fff;
      color: #fff;
      font-weight: 900;
      font-size: 12px;
      padding: 9px 16px;
      border-radius: 16px;
      cursor: pointer;
    }
    #btn-mute {
      pointer-events: auto;
      background: rgba(0, 243, 255, 0.18);
      border: 1px solid rgba(0, 243, 255, 0.55);
      color: #fff;
      padding: 5px 10px;
      border-radius: 11px;
      cursor: pointer;
    }

    /* PAINEL QUE APARECE APENAS AO PASSAR DE FASE OU MORRER */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 5, 14, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 99;
    }
    .modal-card {
      background: rgba(12, 18, 38, 0.92);
      border: 2px solid #00f3ff;
      border-radius: 22px;
      padding: 24px 20px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }
    .modal-card h2 {
      font-size: 28px;
      font-weight: 900;
      color: #ffcc00;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
    }
    .modal-card p {
      font-size: 13.5px;
      color: #c2d1eb;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    input[type="text"] {
      user-select: text;
      background: #060916;
      border: 2px solid #00f3ff;
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      width: 100%;
    }
    .modal-btn {
      background: linear-gradient(135deg, #ff0055, #ff6600);
      border: none;
      padding: 14px 20px;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      letter-spacing: 1px;
    }
    .record-tag {
      margin-top: 12px;
      font-size: 12px;
      color: #00ff88;
      font-weight: 700;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="760"></canvas>
    
    <div id="ui-layer">
      <div>
        <div class="hud-top">
          <div>FASE <span id="hud-level" style="color:#ffcc00;">1</span>/20</div>
          <div>SCORE <span id="hud-score" style="color:#00f3ff;">0</span></div>
          <div>
            HP<div class="bar-wrap"><div id="hud-hp-fill"></div></div>
          </div>
          <div>
            ULT<div class="bar-wrap"><div id="hud-ult-fill"></div></div>
          </div>
          <button id="btn-mute" type="button">🔊</button>
        </div>

        <div id="boss-hud" class="hidden">
          <div id="boss-name">👑 MEMENOEL 3D — NÍVEL 1</div>
          <div class="boss-bar-bg"><div id="boss-hp-fill"></div></div>
        </div>
      </div>

      <div class="hud-bottom">
        <div id="combo-badge">COMBO x1</div>
        <button id="btn-ult" type="button" class="hidden">⚡ SUPER LASER (ESPAÇO)</button>
      </div>
    </div>

    <!-- PAINEL DE NOME (SÓ APARECE AO PASSAR DE NÍVEL OU MORRER) -->
    <div id="status-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h2 id="modal-title">SETOR CONCLUÍDO!</h2>
        <p id="modal-desc">Digite seu apelido de piloto para salvar seu progresso e continuar.</p>
        <input type="text" id="player-name" placeholder="Seu apelido de piloto" maxlength="14" autocomplete="off">
        <button id="modal-action-btn" type="button" class="modal-btn">SALVAR E CONTINUAR (ENTER)</button>
        <div id="record-display" class="record-tag"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // JOGO INICIA DIRETO NO MODO PLAYING
    let gameState = 'PLAYING';
    let modalMode = 'NEXT_LEVEL'; // 'NEXT_LEVEL' ou 'RESTART'
    let level = 1;
    let score = 0;
    let combo = 1;
    let comboTimer = 0;
    let frameCount = 0;
    let enemiesKilled = 0;
    let bossActive = false;
    let screenShake = 0;
    let isMuted = false;
    let audioCtx = null;
    let bgmTimer = null;
    let bgmStep = 0;

    const player = {
      x: 300, y: 650, speed: 6.8, hp: 100, maxHp: 100,
      shootTimer: 0, weaponLevel: 1, tilt: 0,
      ultCharge: 0, ultActiveTimer: 0, invulnTimer: 60
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerups = [];
    let particles = [];
    let floatingTexts = [];
    let boss = null;
    const keys = {};
    let isPointerDown = false;

    const sectorThemes = [
      { bg1: '#05091c', bg2: '#170729', grid: 'rgba(0, 243, 255, 0.14)', laser: '#00f3ff', enemy: '#ff0055' },
      { bg1: '#041a14', bg2: '#150624', grid: 'rgba(0, 255, 136, 0.14)', laser: '#00ff88', enemy: '#ffaa00' },
      { bg1: '#1c0514', bg2: '#070a21', grid: 'rgba(255, 0, 128, 0.16)', laser: '#ffcc00', enemy: '#00e1ff' },
      { bg1: '#120524', bg2: '#041421', grid: 'rgba(170, 0, 255, 0.16)', laser: '#ff33cc', enemy: '#33ff57' },
      { bg1: '#1f0e03', bg2: '#0d041a', grid: 'rgba(255, 136, 0, 0.15)', laser: '#00ffff', enemy: '#ff2244' }
    ];

    const stars3D = [];
    for (let i = 0; i < 160; i++) {
      stars3D.push({
        x: (Math.random() - 0.5) * 1400,
        y: (Math.random() - 0.5) * 1400,
        z: Math.random() * 1000 + 10
      });
    }

    function getTheme() {
      const idx = (level - 1) % sectorThemes.length;
      let c = 0;
      for (const s of sectorThemes) {
        if (c === idx) return s;
        c++;
      }
      return { bg1: '#05091c', bg2: '#170729', grid: 'rgba(0, 243, 255, 0.14)', laser: '#00f3ff', enemy: '#ff0055' };
    }

    // Áudio ativa automaticamente no primeiro movimento ou clique
    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!bgmTimer) {
          const notes = [110, 110, 130.8, 146.8, 110, 110, 164.8, 146.8];
          bgmTimer = setInterval(() => {
            if (isMuted || !audioCtx || gameState !== 'PLAYING') return;
            try {
              const t = audioCtx.currentTime;
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
