<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>War Memenoel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #050508;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 750px;
      border: 2px solid #00f3ff;
      border-radius: 12px;
      overflow: hidden;
      background: #070810;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.35);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 15px;
      pointer-events: none;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      background: rgba(10, 15, 30, 0.8);
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid #00f3ff;
    }
    .hp-bar-container {
      width: 85px;
      height: 12px;
      background: #1a1a2e;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #00f3ff;
      display: inline-block;
      vertical-align: middle;
      margin-left: 5px;
    }
    #hud-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
    }
    #btn-mute {
      pointer-events: auto;
      background: #112233;
      border: 1px solid #00f3ff;
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 9, 19, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 99;
    }
    h1 {
      font-size: 38px;
      font-weight: 900;
      color: #ffcc00;
      text-shadow: 0 0 15px #ff0055;
      margin-bottom: 10px;
    }
    p { margin-bottom: 15px; color: #d0d8e8; max-width: 420px; line-height: 1.5; font-size: 14px; }
    input[type="text"] {
      background: #141b2d;
      border: 1px solid #00f3ff;
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 15px;
      text-align: center;
      margin-bottom: 14px;
      outline: none;
      width: 240px;
    }
    button.action-btn {
      background: linear-gradient(45deg, #ff0055, #ff6600);
      border: 2px solid #fff;
      padding: 14px 30px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin: 6px;
    }
    button.action-btn:active { transform: scale(0.95); }
    button.secondary {
      background: linear-gradient(45deg, #0066ff, #00f3ff);
    }
    #leaderboard-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #00f3ff;
      border-radius: 12px;
      padding: 12px;
      width: 90%;
      max-width: 340px;
      margin-top: 15px;
    }
    #leaderboard-box h3 { font-size: 13px; color: #ffcc00; margin-bottom: 8px; }
    .lb-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="750"></canvas>
    
    <div id="ui-layer">
      <div class="hud-top">
        <div>FASE <span id="hud-level" style="color:#ffcc00;">1</span>/20</div>
        <div>SCORE <span id="hud-score" style="color:#00f3ff;">0</span></div>
        <div>
          ESCUDO
          <div class="hp-bar-container"><div id="hud-hp-fill"></div></div>
        </div>
        <button id="btn-mute" type="button" onclick="alternarSom()">🔊</button>
      </div>
    </div>

    <!-- Tela Inicial -->
    <div id="start-screen" class="screen-overlay">
      <h1>WAR MEMENOEL</h1>
      <p>Use Setas/WASD ou arraste o dedo/mouse na tela para pilotar e derrotar o Memenoel!</p>
      
      <input type="text" id="player-name" placeholder="Seu apelido de piloto" maxlength="14">
      
      <div>
        <button id="btn-start" type="button" class="action-btn" onclick="iniciarJogo(1)">INICIAR MISSÃO</button>
        <button id="btn-continue" type="button" class="action-btn secondary hidden" onclick="continuarJogo()">FASE <span id="saved-lvl">1</span></button>
      </div>

      <div id="leaderboard-box">
        <h3>🏆 SEU RECORDE</h3>
        <div id="leaderboard-list"></div>
      </div>
    </div>

    <!-- Tela de Game Over / Vitória -->
    <div id="end-screen" class="screen-overlay hidden">
      <h1 id="end-title">FIM DE JOGO</h1>
      <p id="end-desc">O Memenoel levou a melhor desta vez.</p>
      <button id="btn-restart" type="button" class="action-btn" onclick="reiniciarFase()">JOGAR NOVAMENTE</button>
      <button id="btn-menu" type="button" class="action-btn secondary" onclick="voltarMenu()">TELA INICIAL</button>
    </div>
  </div>

  <script>
    // Variáveis Globais
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var gameState = 'START';
    var level = 1;
    var savedMaxLevel = 1;
    var score = 0;
    var frameCount = 0;
    var enemiesKilledInLevel = 0;
    var bossActive = false;
    var screenShake = 0;
    var isMuted = false;
    var audioCtx = null;
    var bgmTimer = null;
    var bgmStep = 0;

    var player = {
      x: 300, y: 650, speed: 6.5, hp: 100, maxHp: 100,
      shootTimer: 0, weaponLevel: 1, tilt: 0, magnetTimer: 0
    };

    var bullets = [];
    var enemyBullets = [];
    var enemies = [];
    var powerups = [];
    var particles = [];
    var floatingTexts = [];
    var boss = null;
    var keys = {};
    var isPointerDown = false;

    var galaxyThemes = [
      { bg1: '#0a0f29', bg2: '#1a0b2e', laser: '#00f3ff', enemy: '#ff0055' },
      { bg1: '#091f1c', bg2: '#1d0b2b', laser: '#00ff88', enemy: '#ffaa00' },
      { bg1: '#240b1c', bg2: '#0c1026', laser: '#ffcc00', enemy: '#00e1ff' },
      { bg1: '#190a2e', bg2: '#081b29', laser: '#ff33cc', enemy: '#33ff57' },
      { bg1: '#261405', bg2: '#12071f', laser: '#00ffff', enemy: '#ff2244' }
    ];

    var stars = [];
    for (var i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * 600,
        y: Math.random() * 750,
        size: Math.random() * 2.5 + 0.5,
        speed: Math.random() * 2.5 + 1
      });
    }

    // Funções de Áudio Seguras
    function initAudio() {
      try {
        if (!audioCtx) {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!bgmTimer) {
          var notes = [110, 110, 130.8, 146.8, 110, 110, 164.8, 146.8];
          bgmTimer = setInterval(function() {
            if (isMuted || !audioCtx || gameState !== 'PLAYING') return;
            try {
              var osc = audioCtx.createOscillator();
              var gain = audioCtx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(notes[bgmStep % notes.length], audioCtx.currentTime);
              gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
              osc.connect(gain); gain.connect(audioCtx.destination);
              osc.start(); osc.stop(audioCtx.currentTime + 0.18);
              bgmStep++;
            } catch (e) {}
          }, 220);
        }
      } catch (e) {}
    }

    function playLaserSound() {
      if (isMuted || !audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    function playExplosionSound() {
      if (isMuted || !audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    function alternarSom() {
      isMuted = !isMuted;
      document.getElementById('btn-mute').textContent = isMuted ? '🔇' : '🔊';
    }

    // Save Seguro
    function carregarRecorde() {
      try {
        var nick = localStorage.getItem('warMemenoelNick') || '';
        document.getElementById('player-name').value = nick;
        var data = JSON.parse(localStorage.getItem('warMemenoelSave') || '{"maxLevel":1,"highScore":0}');
        savedMaxLevel = data.maxLevel || 1;
        if (savedMaxLevel > 1) {
          document.getElementById('saved-lvl').textContent = savedMaxLevel;
