<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>War Memenoel — Arcade Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at top, #121629 0%, #050508 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 750px;
      border: 2px solid rgba(0, 243, 255, 0.6);
      border-radius: 18px;
      overflow: hidden;
      background: #070810;
      box-shadow: 0 0 60px rgba(0, 243, 255, 0.25), 0 0 100px rgba(255, 0, 85, 0.15);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 16px;
      pointer-events: none;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      background: rgba(12, 18, 36, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 24px;
      border: 1px solid rgba(0, 243, 255, 0.35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .hp-bar-container {
      width: 85px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(0, 243, 255, 0.5);
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    #hud-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      transition: width 0.2s ease;
    }
    #btn-mute {
      pointer-events: auto;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid rgba(0, 243, 255, 0.5);
      color: #fff;
      padding: 5px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(13, 17, 38, 0.65) 0%, rgba(5, 7, 15, 0.88) 100%);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 99;
    }
    .menu-card {
      background: rgba(15, 22, 44, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 243, 255, 0.35);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(0, 243, 255, 0.08);
      animation: floatCard 4s ease-in-out infinite;
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .badge-edition {
      display: inline-block;
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid #ff0055;
      color: #ff6699;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .hero-emblem {
      width: 76px;
      height: 76px;
      margin: 0 auto 10px auto;
      filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.6));
    }
    h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.05;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff0055, #ffcc00, #00f3ff, #ff0055);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 3.5s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes gradientFlow { to { background-position: 200% center; } }

    .subtitle {
      color: #b8c7e0;
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .controls-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      color: #00f3ff;
      font-weight: 600;
    }
    input[type="text"] {
      background: rgba(7, 10, 22, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #fff;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      outline: none;
      width: 100%;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    button.action-btn {
      background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
      border: none;
      padding: 15px 24px;
      color: white;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.45);
      transition: transform 0.15s;
    }
    button.action-btn:active { transform: scale(0.97); }
    button.secondary {
      background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
      box-shadow: 0 8px 25px rgba(0, 212, 255, 0.35);
    }
    #leaderboard-box {
      background: rgba(7, 10, 22, 0.65);
      border: 1px solid rgba(255, 204, 0, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      margin-top: 18px;
      width: 100%;
    }
    #leaderboard-box h3 {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #ffcc00;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 700;
      padding: 4px 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="750"></canvas>
    
    <div id="ui-layer">
      <div class="hud-top">
        <div>FASE <span id="hud-level" style="color:#ffcc00;">1</span>/20</div>
        <div>SCORE <span id="hud-score" style="color:#00f3ff;">0</span></div>
        <div>
          ESCUDO
          <div class="hp-bar-container"><div id="hud-hp-fill"></div></div>
        </div>
        <button id="btn-mute" type="button">🔊</button>
      </div>
    </div>

    <!-- TELA INICIAL MODERNA -->
    <div id="start-screen" class="screen-overlay">
      <div class="menu-card">
        <div class="badge-edition">20 Níveis • Boss Rush</div>
        
        <svg class="hero-emblem" viewBox="0 0 100 100">
          <circle cx="50" cy="56" r="32" fill="#ffffff"/>
          <circle cx="50" cy="46" r="24" fill="#ffccaa"/>
          <path d="M26 34 L74 34 L60 6 Z" fill="#ff0044"/>
          <rect x="24" y="30" width="52" height="9" rx="4" fill="#ffffff"/>
          <circle cx="62" cy="7" r="7" fill="#ffffff"/>
          <rect x="30" y="39" width="17" height="9" fill="#090a0f"/>
          <rect x="53" y="39" width="17" height="9" fill="#090a0f"/>
          <rect x="47" y="41" width="6" height="3" fill="#090a0f"/>
          <rect x="33" y="41" width="4" height="2" fill="#00f3ff"/>
          <rect x="56" y="41" width="4" height="2" fill="#00f3ff"/>
          <circle cx="50" cy="51" r="5" fill="#ff1a40"/>
        </svg>

        <h1>WAR MEMENOEL</h1>
        <p class="subtitle">Atravesse 20 galáxias neon e derrote o temível Memenoel ao final de cada setor.</p>
        
        <div class="controls-pills">
          <span class="pill">⌨️ Setas / WASD</span>
          <span class="pill">📱 Arraste na Tela</span>
          <span class="pill">⚡ Tiro Automático</span>
        </div>

        <input type="text" id="player-name" placeholder="Digite seu apelido de piloto" maxlength="14">
        
        <div class="btn-group">
          <button id="btn-start" type="button" class="action-btn">🚀 INICIAR MISSÃO</button>
          <button id="btn-continue" type="button" class="action-btn secondary hidden">⚡ CONTINUAR FASE <span id="saved-lvl">1</span></button>
        </div>

        <div id="leaderboard-box">
          <h3>🏆 Melhor Marca do Piloto</h3>
          <div id="leaderboard-list"></div>
        </div>
      </div>
    </div>

    <!-- TELA DE FIM DE JOGO -->
    <div id="end-screen" class="screen-overlay hidden">
      <div class="menu-card">
        <div class="badge-edition" id="end-badge">Relatório de Batalha</div>
        <h1 id="end-title">FIM DE JOGO</h1>
        <p class="subtitle" id="end-desc">O Memenoel levou a melhor desta vez.</p>
        <div class="btn-group">
          <button id="btn-restart" type="button" class="action-btn">🔄 TENTAR NOVAMENTE</button>
          <button id="btn-menu" type="button" class="action-btn secondary">🏠 TELA INICIAL</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var canvas = document.getElementById('gameCanvas');
      var ctx = canvas.getContext('2d');
      var gameState = 'START';
      var level = 1;
      var savedMaxLevel = 1;
      var score = 0;
      var frameCount = 0;
      var enemiesKilledInLevel = 0;
      var bossActive = false;
      var screenShake = 0;
      var isMuted = false;
      var audioCtx = null;
      var bgmTimer = null;
      var bgmStep = 0;

      var player = {
        x: 300, y: 650, speed: 6.5, hp: 100, maxHp: 100,
        shootTimer: 0, weaponLevel: 1
