<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War Memenoel: Edição Definitiva</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050508;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(255, 0, 85, 0.3);
      border: 2px solid #00f3ff;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #070810;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(4px);
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      text-shadow: 0 0 8px #00f3ff;
    }
    .hp-bar-container {
      width: 95px;
      height: 12px;
      background: #1a1a2e;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #00f3ff;
      display: inline-block;
      vertical-align: middle;
      margin-left: 5px;
    }
    #hud-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      transition: width 0.2s;
    }
    #btn-mute {
      pointer-events: auto;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid #00f3ff;
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin: 0;
      box-shadow: none;
    }
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(16, 20, 40, 0.88) 0%, rgba(5, 6, 12, 0.96) 100%);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: auto;
      padding: 20px;
    }
    h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff0055, #ffcc00, #00f3ff, #ff0055);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.5));
    }
    @keyframes shine { to { background-position: 200% center; } }
    p { margin-bottom: 14px; color: #d0d8e8; max-width: 440px; line-height: 1.5; font-size: 14px; }
    input[type="text"] {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00f3ff;
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 15px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      width: 240px;
    }
    input[type="text"]::placeholder { color: #8899aa; }
    button.action-btn {
      background: linear-gradient(45deg, #ff0055, #ff6600);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 28px;
      color: white;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
      transition: all 0.2s;
      margin: 5px;
    }
    button.action-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 85, 0.9); }
    button.secondary {
      background: linear-gradient(45deg, #0066ff, #00f3ff);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
    }
    #leaderboard-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 12px;
      padding: 12px 18px;
      width: 340px;
      margin-top: 14px;
    }
    #leaderboard-box h3 {
      font-size: 14px;
      color: #ffcc00;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .lb-row:last-child { border-bottom: none; }
    #cloud-status {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: #00ff88;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="750"></canvas>
    
    <div id="ui-layer">
      <div class="hud-top">
        <div>FASE <span id="hud-level" style="color:#ffcc00;">1</span>/20</div>
        <div>SCORE <span id="hud-score" style="color:#00f3ff;">0</span></div>
        <div>
          ESCUDO
          <div class="hp-bar-container"><div id="hud-hp-fill"></div></div>
        </div>
        <button id="btn-mute" title="Alternar Som">🔊</button>
      </div>
      <div id="cloud-status">☁️ Nuvem: Modo Local (Configure o Firebase)</div>
    </div>

    <!-- Tela Inicial -->
    <div id="start-screen" class="screen-overlay">
      <h1>WAR MEMENOEL</h1>
      <p>Enfrente 20 galáxias, colete power-ups e derrote o Memenoel!</p>
      
      <input type="text" id="player-name" placeholder="Seu apelido de piloto" maxlength="14">
      
      <div>
        <button id="btn-start" class="action-btn">INICIAR MISSÃO</button>
        <button id="btn-continue" class="action-btn secondary hidden">FASE <span id="saved-lvl">1</span></button>
      </div>

      <div id="leaderboard-box">
        <h3>🏆 RANKING GLOBAL (TOP 5)</h3>
        <div id="leaderboard-list">
          <div class="lb-row"><span>Carregando placar...</span></div>
        </div>
      </div>
    </div>

    <!-- Tela de Game Over / Vitória -->
    <div id="end-screen" class="screen-overlay hidden">
      <h1 id="end-title">FIM DE JOGO</h1>
      <p id="end-desc">O Memenoel levou a melhor desta vez.</p>
      <button id="btn-restart" class="action-btn">JOGAR NOVAMENTE</button>
      <button id="btn-menu" class="action-btn secondary">VER RANKING</button>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- MÓDULO FIREBASE, ÁUDIO RETRÔ E ENGINE DO WAR MEMENOEL                 -->
  <!-- ===================================================================== -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://gstatic.com";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://gstatic.com";

    // COLE SUAS CREDENCIAIS DO FIREBASE AQUI:
    const firebaseConfig = {
      apiKey: "SUA_API_KEY_AQUI",
      authDomain: "SEU_://firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_://appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    let db = null;
    let userId = null;
    let useCloud = false;
    const statusEl = document.getElementById('cloud-status');
    const nameInput = document.getElementById('player-name');

    // Recupera apelido salvo anteriormente
    nameInput.value = localStorage.getItem('warMemenoelNick') || '';

    if (firebaseConfig.apiKey !== "SUA_API_KEY_AQUI") {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        const auth = getAuth(app);
        signInAnonymously(auth).catch((err) => console.error("Erro Auth:", err));
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            userId = user.uid;
            useCloud = true;
            statusEl.textContent = "☁️ War Memenoel Cloud: Conectado";
            await loadProgress();
            await loadLeaderboard();
          }
        });
      } catch (e) {
        statusEl.textContent = "⚠️ Erro no Firebase (Modo Local)";
        loadLocalProgress();
        renderLocalLeaderboard();
      }
    } else {
      loadLocalProgress();
      renderLocalLeaderboard();
    }

    async function saveProgress(levelToSave, currentScore) {
      const nick = (nameInput.value.trim() || "Piloto Anônimo");
      localStorage.setItem('warMemenoelNick', nick);

      const localData = JSON.parse(localStorage.getItem('warMemenoelSave') || '{"maxLevel":1, "highScore":0}');
      const newMaxLevel = Math.max(localData.maxLevel, levelToSave);
      const newHighScore = Math.max(localData.highScore, currentScore);
      localStorage.setItem('warMemenoelSave', JSON.stringify({ maxLevel: newMaxLevel, highScore: newHighScore }));

      if (useCloud && db && userId) {
        statusEl.textContent = "☁️ Salvando recorde...";
        try {
          await setDoc(doc(db, "jogadores_memenoel", userId), {
            nickname: nick,
            maxLevel: newMaxLevel,
            highScore: newHighScore,
            updatedAt: new Date().toISOString()
          }, { merge: true });
          statusEl.textContent = "☁️ Salvo na nuvem!";
          await loadLeaderboard();
        } catch (error) {
          statusEl.textContent = "⚠️ Erro ao salvar na nuvem";
        }
      } else {
        renderLocalLeaderboard();
