<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAR MEMENOEL — Ultra Graphics Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0c1024 0%, #020306 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 760px;
      border: 2px solid rgba(0, 243, 255, 0.75);
      border-radius: 20px;
      overflow: hidden;
      background: #04050a;
      box-shadow: 0 0 80px rgba(0, 243, 255, 0.35), 0 0 140px rgba(255, 0, 85, 0.25);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 14px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      background: rgba(8, 13, 28, 0.78);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 22px;
      border: 1px solid rgba(0, 243, 255, 0.45);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    .bar-wrap {
      width: 75px;
      height: 9px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: inline-block;
      vertical-align: middle;
      margin-left: 5px;
    }
    #hud-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      box-shadow: 0 0 10px #00ff88;
      transition: width 0.15s ease;
    }
    #hud-ult-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff8800, #ffee00);
      box-shadow: 0 0 10px #ffee00;
      transition: width 0.15s ease;
    }
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    #combo-badge {
      background: linear-gradient(135deg, #ff0055, #ff7700);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.7);
      opacity: 0;
      transition: opacity 0.2s, transform 0.15s;
    }
    #btn-ult {
      pointer-events: auto;
      background: linear-gradient(135deg, #ffaa00, #ff0055);
      border: 2px solid #fff;
      color: #fff;
      font-weight: 900;
      font-size: 12px;
      padding: 9px 16px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.9);
      animation: pulseUlt 0.9s infinite;
    }
    @keyframes pulseUlt {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    #btn-mute {
      pointer-events: auto;
      background: rgba(0, 243, 255, 0.18);
      border: 1px solid rgba(0, 243, 255, 0.55);
      color: #fff;
      padding: 5px 10px;
      border-radius: 11px;
      cursor: pointer;
    }
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(12, 16, 36, 0.55) 0%, rgba(3, 5, 12, 0.9) 100%);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 99;
    }
    .menu-card {
      background: rgba(12, 18, 38, 0.82);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 243, 255, 0.45);
      border-radius: 26px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.75), inset 0 0 35px rgba(0, 243, 255, 0.12);
    }
    .badge-edition {
      display: inline-block;
      background: rgba(255, 0, 85, 0.25);
      border: 1px solid #ff0055;
      color: #ff80b3;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .hero-emblem {
      width: 78px;
      height: 78px;
      margin: 0 auto 8px auto;
      filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.8));
    }
    h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.05;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff0055, #ffcc00, #00f3ff, #ff0055);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 3s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes gradientFlow { to { background-position: 200% center; } }
    .subtitle {
      color: #c2d1eb;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .controls-pills {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: #00f3ff;
      font-weight: 700;
    }
    input[type="text"] {
      background: rgba(5, 8, 18, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.55);
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      outline: none;
      width: 100%;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    button.action-btn {
      background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
      border: none;
      padding: 15px 22px;
      color: white;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 28px rgba(255, 0, 85, 0.55);
    }
    button.action-btn:active { transform: scale(0.97); }
    button.secondary {
      background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
      box-shadow: 0 8px 28px rgba(0, 212, 255, 0.45);
    }
    #leaderboard-box {
      background: rgba(5, 8, 18, 0.75);
      border: 1px solid rgba(255, 204, 0, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
      margin-top: 16px;
      width: 100%;
    }
    #leaderboard-box h3 {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #ffcc00;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      padding: 3px 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="760"></canvas>
    
    <div id="ui-layer">
      <div class="hud-top">
        <div>FASE <span id="hud-level" style="color:#ffcc00;">1</span>/20</div>
        <div>SCORE <span id="hud-score" style="color:#00f3ff;">0</span></div>
        <div>
          HP<div class="bar-wrap"><div id="hud-hp-fill"></div></div>
        </div>
        <div>
          ULT<div class="bar-wrap"><div id="hud-ult-fill"></div></div>
        </div>
        <button id="btn-mute" type="button">🔊</button>
      </div>

      <div class="hud-bottom">
        <div id="combo-badge">COMBO x1</div>
        <button id="btn-ult" type="button" class="hidden">⚡ DISPARAR SUPER LASER (ESPAÇO)</button>
      </div>
    </div>

    <div id="start-screen" class="screen-overlay">
      <div class="menu-card">
        <div class="badge-edition">Ultra Graphics • 20 Setores</div>
        
        <svg class="hero-emblem" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="hatG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff1a40"/>
              <stop offset="100%" stop-color="#99001a"/>
            </linearGradient>
            <radialGradient id="faceG" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#ffe5d4"/>
              <stop offset="100%" stop-color="#e09a75"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="56" r="32" fill="#f1f5f9"/>
          <circle cx="50" cy="46" r="24" fill="url(#faceG)"/>
          <path d="M26 34 L74 34 L60 6 Z" fill="url(#hatG)"/>
          <rect x="24" y="30" width="52" height="9" rx="4" fill="#ffffff"/>
          <circle cx="62" cy="7" r="7" fill="#ffffff"/>
          <rect x="30" y="39" width="17" height="9" fill="#090a0f"/>
          <rect x="53" y="39" width="17" height="9" fill="#090a0f"/>
          <rect x="47" y="41" width="6" height="3" fill="#090a0f"/>
          <rect x="33" y="41" width="4" height="2" fill="#00f3ff"/>
          <rect x="56" y="41" width="4" height="2" fill="#00f3ff"/>
          <circle cx="50" cy="51" r="5" fill="#ff1a40"/>
        </svg>

        <h1>WAR MEMENOEL</h1>
        <p class="subtitle">Gráficos estelares em alta definição, 4 classes de naves inimigas e o temível Memenoel em 20 fases.</p>
        
        <div class="controls-pills">
          <span class="pill">⌨️ Setas / WASD</span>
