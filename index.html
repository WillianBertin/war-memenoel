<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>War Memenoel — Ultra Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0c1229 0%, #020308 100%);
      color: #fff; font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    #box {
      position: relative; width: 100%; max-width: 600px; height: 100%; max-height: 760px;
      border: 2px solid #00f3ff; border-radius: 20px; overflow: hidden;
      background: #03050c; box-shadow: 0 0 80px rgba(0, 243, 255, 0.35), 0 0 140px rgba(255, 0, 85, 0.25);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 4px;
      background: rgba(8, 12, 26, 0.9); border: 1px solid rgba(0, 243, 255, 0.6);
      border-radius: 18px; padding: 7px 9px; font-size: 10.5px; font-weight: bold;
      pointer-events: none; z-index: 10; backdrop-filter: blur(5px);
    }
    .bar-bg {
      display: inline-block; width: 44px; height: 8px; background: #161c2e;
      border-radius: 5px; overflow: hidden; vertical-align: middle; margin-left: 2px;
    }
    #hp-bar { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #00ff88); transition: width 0.15s; }
    #ult-bar { display: block; width: 0%; height: 100%; background: linear-gradient(90deg, #ff8800, #ffee00); transition: width 0.15s; }
    .hud-btn {
      pointer-events: auto; background: #112233; border: 1px solid #00f3ff;
      color: #fff; padding: 4px 7px; border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: bold;
    }
    #btn-pause { border-color: #ffcc00; color: #ffcc00; }
    #hud-bot {
      position: absolute; bottom: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    #combo-tag {
      background: linear-gradient(90deg, #ff0055, #ff6600);
      padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; opacity: 0;
      transition: opacity 0.2s; box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
    }
    #btn-ult {
      pointer-events: auto; background: linear-gradient(90deg, #ffaa00, #ff0055);
      border: 2px solid #fff; color: #fff; font-weight: bold; font-size: 12px;
      padding: 8px 14px; border-radius: 14px; cursor: pointer;
      animation: pulseUlt 0.9s infinite alternate;
    }
    @keyframes pulseUlt {
      from { transform: scale(1); box-shadow: 0 0 10px #ffaa00; }
      to { transform: scale(1.07); box-shadow: 0 0 24px #ff0055; }
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(10, 15, 34, 0.65) 0%, rgba(3, 5, 12, 0.94) 100%);
      backdrop-filter: blur(5px); display: flex; align-items: center;
      justify-content: center; padding: 14px; z-index: 50;
    }
    .card {
      background: rgba(12, 19, 38, 0.94); border: 2px solid rgba(0, 243, 255, 0.7);
      border-radius: 24px; padding: 16px 18px; width: 100%; max-width: 405px;
      text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      max-height: 96%; overflow-y: auto;
    }
    .badge {
      display: inline-block; background: rgba(255, 0, 85, 0.22); border: 1px solid #ff0055;
      color: #ff85b3; font-size: 10px; font-weight: bold; letter-spacing: 1.5px;
      padding: 4px 12px; border-radius: 16px; margin-bottom: 6px; text-transform: uppercase;
    }
    h1 {
      font-size: 29px; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 5px;
      background: linear-gradient(90deg, #ff0055, #ffcc00, #00f3ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { color: #c2d1eb; font-size: 12px; margin-bottom: 10px; line-height: 1.35; }
    input {
      user-select: text; width: 100%; padding: 10px; border-radius: 12px;
      border: 2px solid #00f3ff; background: #050814; color: #fff;
      font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 8px; outline: none;
    }
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 12px;
      background: linear-gradient(90deg, #ff0055, #ff6600);
      color: #fff; font-size: 14px; font-weight: bold; cursor: pointer;
      margin-bottom: 7px; box-shadow: 0 6px 20px rgba(255, 0, 85, 0.45);
    }
    .btn-sec {
      background: linear-gradient(90deg, #0066ff, #00d4ff);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }
    .rank-box {
      margin-top: 8px; background: rgba(6, 9, 22, 0.88);
      border: 1px solid rgba(255, 204, 0, 0.45); border-radius: 12px;
      padding: 8px 10px; text-align: left;
    }
    .rank-box h4 {
      color: #ffcc00; font-size: 10.5px; text-transform: uppercase;
      margin-bottom: 5px; text-align: center; letter-spacing: 1px;
    }
    .rk-row {
      display: flex; justify-content: space-between; align-items: center; font-size: 11px;
      padding: 3px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="box">
    <canvas id="c" width="600" height="760"></canvas>
    <div id="hud">
      <div>FASE <span id="lvl" style="color:#ffcc00;">1</span>/20</div>
      <div>ARMA <span id="wpn-lvl" style="color:#ffaa00;">NV.1</span></div>
      <div>PTS <span id="pts" style="color:#00f3ff;">0</span></div>
      <div>HP <span class="bar-bg"><span id="hp-bar"></span></span></div>
      <div>ULT <span class="bar-bg"><span id="ult-bar"></span></span></div>
      <button id="btn-pause" class="hud-btn" type="button">PAUSAR</button>
      <button id="btn-som" class="hud-btn" type="button">SOM</button>
    </div>
    <div id="hud-bot">
      <div id="combo-tag">COMBO x1</div>
      <button id="btn-ult" type="button" class="hidden">SUPER LASER (ESPACO)</button>
    </div>

    <div id="start-screen" class="overlay">
      <div class="card">
        <div class="badge">Ultra Graphics • Chefão em Todo Setor</div>
        <h1>WAR MEMENOEL</h1>
        <p class="sub">Todo andar tem um chefão! Sobreviva à brutalidade extrema dos Setores 19 e 20!</p>
        <input type="text" id="nome-inicio" placeholder="Seu apelido de piloto" maxlength="14">
        <button id="btn-play" type="button" class="btn">DECOLAR AGORA</button>
        <button id="btn-cont" type="button" class="btn btn-sec hidden">CONTINUAR FASE <span id="max-lvl">1</span></button>
        <div class="rank-box">
          <h4>Top 5 Melhores Pilotos</h4>
          <div id="rank-inicio"></div>
        </div>
      </div>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <div class="card">
        <div class="badge">Jogo Pausado</div>
        <h2 style="color:#ffcc00; margin-bottom:8px;">EM ESPERA</h2>
        <button id="btn-resume" type="button" class="btn">CONTINUAR</button>
        <button id="btn-pause-menu" type="button" class="btn btn-sec">MENU PRINCIPAL</button>
      </div>
    </div>

    <div id="modal" class="overlay hidden">
      <div class="card">
        <h2 id="m-tit" style="color:#ffcc00; margin-bottom:8px;">FASE VENCIDA!</h2>
        <p id="m-desc" class="sub">Confira sua posição no ranking:</p>
        <input type="text" id="nome-modal" placeholder="Seu apelido de piloto" maxlength="14">
        <button id="btn-ok" type="button" class="btn">CONTINUAR MISSAO</button>
        <button id="btn-menu" type="button" class="btn btn-sec">TELA INICIAL</button>
        <div class="rank-box">
          <h4>Top 5 Melhores Pilotos</h4>
          <div id="rank-modal"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var c = document.getElementById('c'), ctx = c.getContext('2d');
    var estado = 'INICIO', modo = 'PROX', fase = 1, maxFaseSalva = 1, pontos = 0, combo = 1, comboT = 0;
    var q = 0, abates = 0, metaAbates = 12, chefeOn = false, tremor = 0, mudo = false, ac = null;
    var nave = { x: 300, y: 650, hp: 100, t: 0, arma: 1, ult: 0, laserT: 0, escudoT: 0, tilt: 0 };
    var tiros = [], tChefe = [], inimigos = [], itens = [], parts = [], ondas = [], estrelas = [];
    var chefe = null, teclas = {}, alvoX = 300, alvoY = 650, tocando = false;

    for (var i = 0; i < 85; i++) {
      var camada = (i % 3) + 1;
      estrelas.push({
        x: Math.random() * 600, y: Math.random() * 760,
        v: camada * 1.1, r: camada * 0.75,
        cor: camada === 3 ? '#00f3ff' : (camada === 2 ? '#c2d1eb' : '#64748b')
      });
    }

    function som(freq, tipo, dur, vol) {
      if (mudo) return;
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        var osc = ac.createOscillator(), gain = ac.createGain();
        osc.type = tipo || 'sine';
        osc.frequency.setValueAtTime(freq, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.35), ac.currentTime + dur);
        gain.gain.setValueAtTime(vol || 0.08, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(); osc.stop(ac.currentTime + dur);
      } catch (e) {}
    }

    function criarParticulas(x, y, cor, qtd, ondaChoque) {
      for (var i = 0; i < qtd; i++) {
        var ang = Math.random() * Math.PI * 2, vel = 1.2 + Math.random() * 5;
        parts.push({ x: x, y: y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, vida: 22 + Math.random() * 18, cor: cor, r: 2 + Math.random() * 2.5 });
      }
      if (ondaChoque) ondas.push({ x: x, y: y, r: 8, maxR: 65, cor: cor, alpha: 1 });
    }

    function iniciarFase(numFase) {
      fase = numFase;
      abates = 0;
      chefeOn = false;
      chefe = null;
      tiros = [];
      tChefe = [];
      inimigos = [];
      itens = [];
      metaAbates = (fase >= 19) ? 24 : (10 + fase * 2);
      document.getElementById('lvl').textContent = fase;
      atualizarHUD();
    }

    function invocarChefe() {
      chefeOn = true;
      var isFinal = (fase === 20);
      var isInferno = (fase >= 19);
      var vidaMax = isFinal ? 6500 : (isInferno ? 4800 : (400 + fase * 95));
      chefe = {
        x: 300, y: -100, alvoY: 140, vx: (isInferno ? 3.5 : 2.2) + (fase * 0.08),
        hp: vidaMax, maxHp: vidaMax, t: 0, final: isFinal, inferno: isInferno,
        modoCor: 'FOGO', corAura: isInferno ? '#ff0000' : '#ff0055', angEspiral: 0
      };
      tremor = 25;
      som(80, 'sawtooth', 0.8, 0.2);
    }

    function atualizarHUD() {
      document.getElementById('pts').textContent = pontos;
      document.getElementById('wpn-lvl').textContent = 'NV.' + nave.arma;
      document.getElementById('hp-bar').style.width = Math.max(0, nave.hp) + '%';
      document.getElementById('ult-bar').style.width = Math.min(100, nave.ult) + '%';
      var tag = document.getElementById('combo-tag');
      if (combo > 1) { tag.textContent = 'COMBO x' + combo; tag.style.opacity = '1'; } else { tag.style.opacity = '0'; }
      var btnUlt = document.getElementById('btn-ult');
      if (nave.ult >= 100) btnUlt.classList.remove('hidden'); else btnUlt.classList.add('hidden');
    }

    function ativarSuperLaser() {
      if (nave.ult < 100 || estado !== 'JOGANDO') return;
      nave.ult = 0; nave.laserT = 135; tremor = 16;
      som(220, 'sawtooth', 0.85, 0.16);
      atualizarHUD();
    }

    function sofrerDano(dano) {
      if (nave.escudoT > 0) return;
      nave.hp -= (fase >= 19 ? dano * 1.5 : dano);
      combo = 1; tremor = 14;
      criarParticulas(nave.x, nave.y, '#ff0055', 16, true);
      som(90, 'square', 0.28, 0.14);
      if (nave.hp <= 0) {
        nave.hp = 0; atualizarHUD();
        encerrarPartida('DERROTA!', 'Sua nave foi destruída no setor ' + fase + '.', 'REINICIAR');
      }
    }

    function buscarAlvoMaisProximo(x, y) {
      if (chefeOn && chefe) return chefe;
      var alvo = null, menorDist = 9999;
      for (var i = 0; i < inimigos.length; i++) {
        var d = Math.hypot(inimigos[i].x - x, inimigos[i].y - y);
        if (d < menorDist) { menorDist = d; alvo = inimigos[i]; }
      }
      return alvo;
    }

    function atualizarJogo() {
      if (estado !== 'JOGANDO') return;
      q++;
      if (tremor > 0) tremor--;
      if (nave.escudoT > 0) nave.escudoT--;
      if (nave.laserT > 0) nave.laserT--;
      if (comboT > 0) { comboT--; if (comboT === 0) combo = 1; }

      var vel = 6.8;
      if (teclas['ArrowLeft'] || teclas['KeyA']) alvoX -= vel;
      if (teclas['ArrowRight'] || teclas['KeyD']) alvoX += vel;
      if (teclas['ArrowUp'] || teclas['KeyW']) alvoY -= vel;
      if (teclas['ArrowDown'] || teclas['KeyS']) alvoY += vel;
      alvoX = Math.max(28, Math.min(572, alvoX));
      alvoY = Math.max(80, Math.min(720, alvoY));

      var dx = alvoX - nave.x;
      nave.tilt = Math.max(-0.38, Math.min(0.38, dx * 0.032));
      nave.x += dx * 0.22;
      nave.y += (alvoY - nave.y) * 0.22;

      nave.t++;
      var cadencia = Math.max(6, 14 - nave.arma);
      if (nave.t % cadencia === 0) {
        som(680 + nave.arma * 40, 'triangle', 0.07, 0.04);
        if (nave.arma === 1) {
          tiros.push({ x: nave.x, y: nave.y - 22, vx: 0, vy: -13, d: 20, cor: '#00f3ff', tipo: 'LASER' });
        } else if (nave.arma === 2) {
          tiros.push({ x: nave.x - 11, y: nave.y - 18, vx: 0, vy: -13, d: 18, cor: '#00f3ff', tipo: 'LASER' });
          tiros.push({ x: nave.x + 11, y: nave.y - 18, vx: 0, vy: -13, d: 18, cor: '#00f3ff', tipo: 'LASER' });
        } else if (nave.arma === 3) {
          tiros.push({ x: nave.x, y: nave.y - 24, vx: 0, vy: -14, d: 22, cor: '#ffcc00', tipo: 'LASER' });
          tiros.push({ x: nave.x - 15, y: nave.y - 14, vx: -1.6, vy: -13, d: 18, cor: '#00f3ff', tipo: 'LASER' });
          tiros.push({ x: nave.x + 15, y: nave.y - 14, vx: 1.6, vy: -13, d: 18, cor: '#00f3ff', tipo: 'LASER' });
        } else if (nave.arma === 4) {
          tiros.push({ x: nave.x - 8, y: nave.y - 24, vx: 0, vy: -15, d: 24, cor: '#ff0055', tipo: 'PLASMA' });
          tiros.push({ x: nave.x + 8, y: nave.y - 24, vx: 0, vy: -15, d: 24, cor: '#ff0055', tipo: 'PLASMA' });
        } else {
          tiros.push({ x: nave.x, y: nave.y - 28, vx: 0, vy: -15, d: 35, cor: '#d946ef', tipo: 'ONDA' });
          if (nave.t % (cadencia * 2) === 0) {
            tiros.push({ x: nave.x - 26, y: nave.y - 6, vx: -3.5, vy: -9, d: 38, cor: '#ffcc00', tipo: 'MISSIL' });
            tiros.push({ x: nave.x + 26, y: nave.y - 6, vx: 3.5, vy: -9, d: 38, cor: '#ffcc00', tipo: 'MISSIL' });
          }
        }
      }

      if (!chefeOn) {
        var freqSpawn = fase >= 19 ? 18 : Math.max(16, 42 - fase * 1.5);
        if (q % freqSpawn === 0) {
          var sorteio = Math.random();
          var tipo = sorteio < 0.3 ? 3 : (sorteio < 0.6 ? 2 : 1);
          inimigos.push({
            x: 40 + Math.random() * 520, y: -30,
            vx: (Math.random() - 0.5) * (fase >= 19 ? 4 : 2),
            vy: (fase >= 19 ? 3.5 : 2.2) + (fase * 0.1),
            hp: (fase >= 19 ? 80 : 30) + fase * 6,
            r: 20, tipo: tipo
          });
        }
      }

      for (var i = tiros.length - 1; i >= 0; i--) {
        var t = tiros[i];
        if (t.tipo === 'MISSIL') {
          var alvo = buscarAlvoMaisProximo(t.x, t.y);
          if (alvo) {
            var ang = Math.atan2(alvo.y - t.y, alvo.x - t.x);
            t.vx += Math.cos(ang) * 0.85; t.vy += Math.sin(ang) * 0.85;
            var velAtual = Math.hypot(t.vx, t.vy);
            if (velAtual > 12) { t.vx = (t.vx / velAtual) * 12; t.vy = (t.vy / velAtual) * 12; }
          }
        }
        t.x += t.vx; t.y += t.vy;
        if (t.y < -30 || t.x < -30 || t.x > 630) tiros.splice(i, 1);
      }

      for (var i = inimigos.length - 1; i >= 0; i--) {
        var en = inimigos[i];
        en.x += en.vx; en.y += en.vy;
        if (en.x < 25 || en.x > 575) en.vx *= -1;

        if (nave.laserT > 0 && Math.abs(en.x - nave.x) < 40 && en.y < nave.y) en.hp -= 9;

        for (var j = tiros.length - 1; j >= 0; j--) {
          var tr = tiros[j];
          if (Math.hypot(en.x - tr.x, en.y - tr.y) < en.r + 8) {
            en.hp -= tr.d; criarParticulas(tr.x, tr.y, tr.cor, 4, false);
            if (tr.tipo !== 'ONDA') { tiros.splice(j, 1); break; }
          }
        }

        if (en.hp <= 0) {
          pontos += 30 * combo; combo = Math.min(10, combo + 1); comboT = 135;
          abates++;
          criarParticulas(en.x, en.y, '#ffaa00', 12, false);
          if (Math.random() < 0.18) {
            var tiposItem = ['ARMA', 'HP', 'ESCUDO', 'ULT'];
            itens.push({ x: en.x, y: en.y, vy: 2.6, tipo: tiposItem[Math.floor(Math.random() * tiposItem.length)] });
          }
          inimigos.splice(i, 1);

          if (!chefeOn && abates >= metaAbates) {
            invocarChefe();
          }
          continue;
        }
        if (Math.hypot(en.x - nave.x, en.y - nave.y) < en.r + 18) {
          sofrerDano(22); inimigos.splice(i, 1); continue;
        }
        if (en.y > 790) inimigos.splice(i, 1);
      }

      if (chefeOn && chefe) {
        if (chefe.y < chefe.alvoY) chefe.y += 2;
        else {
          chefe.x += chefe.vx;
          if (chefe.x < 80 || chefe.x > 520) chefe.vx *= -1;
        }
        chefe.t++;

        var ciclo = Math.floor(chefe.t / 180) % 3;
        if (ciclo === 0) { chefe.modoCor = 'FOGO'; chefe.corAura = chefe.inferno ? '#ff0000' : '#ff0055'; }
        else if (ciclo === 1) { chefe.modoCor = 'RAIO'; chefe.corAura = chefe.inferno ? '#ff8800' : '#00f3ff'; }
        else { chefe.modoCor = 'CAOS'; chefe.corAura = '#d946ef'; }

        var cadChefe = chefe.inferno ? 18 : 35;
        if (chefe.t % cadChefe === 0) {
          var qtd = chefe.inferno ? 8 : 4;
          for (var k = 0; k < qtd; k++) {
            var ang = (Math.PI / 2) + ((k - (qtd - 1) / 2) * 0.28);
            tChefe.push({ x: chefe.x, y: chefe.y + 42, vx: Math.cos(ang) * (chefe.inferno ? 7.5 : 5), vy: Math.sin(ang) * (chefe.inferno ? 7.5 : 5), cor: chefe.corAura, dano: chefe.inferno ? 45 : 30 });
          }
          som(120, 'square', 0.15, 0.1);
        }

        if (nave.laserT > 0 && Math.abs(chefe.x - nave.x) < 68) chefe.hp -= 6.5;

        for (var j = tiros.length - 1; j >= 0; j--) {
          var tr = tiros[j];
          if (Math.hypot(chefe.x - tr.x, chefe.y - tr.y) < 58) {
            chefe.hp -= tr.d; criarParticulas(tr.x, tr.y, tr.cor, 5, false);
            if (tr.tipo !== 'ONDA') tiros.splice(j, 1);
          }
        }

        if (chefe.hp <= 0) {
          pontos += (chefe.inferno ? 5000 : 1000) * combo; tremor = 35;
          criarParticulas(chefe.x, chefe.y, '#ffcc00', 50, true);
          chefeOn = false; chefe = null; tChefe = [];
          if (fase >= 20) {
            encerrarPartida('VITÓRIA SUPREMA!', 'Você venceu o modo Inferno e zerou o jogo!', 'REINICIAR');
          } else {
            encerrarPartida('SETOR ' + fase + ' CONCLUÍDO!', 'Chefe derrotado! Avançar:', 'PROX');
          }
          atualizarHUD(); return;
        }
      }

      for (var i = tChefe.length - 1; i >= 0; i--) {
        var tc = tChefe[i];
        tc.x += tc.vx; tc.y += tc.vy;
        if (Math.hypot(tc.x - nave.x, tc.y - nave.y) < 22) {
          sofrerDano(tc.dano || 25); tChefe.splice(i, 1); continue;
        }
        if (tc.y > 790 || tc.y < -40 || tc.x < -40 || tc.x > 640) tChefe.splice(i, 1);
      }

      for (var i = itens.length - 1; i >= 0; i--) {
        var it = itens[i]; it.y += it.vy;
        if (Math.hypot(it.x - nave.x, it.y - nave.y) < 32) {
          som(880, 'sine', 0.18, 0.09);
          if (it.tipo === 'ARMA') nave.arma = Math.min(5, nave.arma + 1);
          else if (it.tipo === 'HP') nave.hp = Math.min(100, nave.hp + 30);
          else if (it.tipo === 'ESCUDO') nave.escudoT = 360;
          else if (it.tipo === 'ULT') nave.ult = Math.min(100, nave.ult + 40);
          itens.splice(i, 1); continue;
        }
        if (it.y > 790) itens.splice(i, 1);
      }

      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i]; p.x += p.vx; p.y += p.vy; p.vida--;
        if (p.vida <= 0) parts.splice(i, 1);
      }
      for (var i = ondas.length - 1; i >= 0; i--) {
        var od = ondas[i]; od.r += 3.2; od.alpha -= 0.05;
        if (od.alpha <= 0 || od.r >= od.maxR) ondas.splice(i, 1);
      }
      atualizarHUD();
    }

    function desenharJogo() {
      ctx.save();
      if (tremor > 0) ctx.translate((Math.random() - 0.5) * tremor, (Math.random() - 0.5) * tremor);
      ctx.fillStyle = fase >= 19 ? '#1a0208' : '#03050c';
      ctx.fillRect(0, 0, 600, 760);

      for (var i = 0; i < estrelas.length; i++) {
        var st = estrelas[i]; st.y += st.v;
        if (st.y > 760) { st.y = 0; st.x = Math.random() * 600; }
        ctx.fillStyle = st.cor; ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (estado === 'JOGANDO') {
        if (nave.laserT > 0) {
          ctx.fillStyle = 'rgba(255, 0, 85, 0.8)';
          ctx.fillRect(nave.x - 20, 0, 40, nave.y);
        }
        for (var i = 0; i < tiros.length; i++) {
          var tr = tiros[i];
          ctx.fillStyle = tr.cor; ctx.fillRect(tr.x - 2.5, tr.y - 11, 5, 20);
        }
        for (var i = 0; i < itens.length; i++) {
          var it = itens[i];
          ctx.fillStyle = '#00ff88'; ctx.beginPath(); ctx.arc(it.x, it.y, 14, 0, Math.PI * 2); ctx.fill();
        }
        for (var i = 0; i < inimigos.length; i++) {
          var en = inimigos[i];
          ctx.fillStyle = '#ff6600'; ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2); ctx.fill();
        }

        if (chefeOn && chefe) {
          ctx.save(); ctx.translate(chefe.x, chefe.y);
          ctx.fillStyle = chefe.corAura; ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

          ctx.fillStyle = 'rgba(10, 15, 30, 0.9)'; ctx.fillRect(140, 52, 320, 14);
          ctx.fillStyle = chefe.corAura; ctx.fillRect(142, 54, 316 * Math.max(0, chefe.hp / chefe.maxHp), 10);
        }

        for (var i = 0; i < tChefe.length; i++) {
          var tc = tChefe[i];
          ctx.fillStyle = tc.cor; ctx.beginPath(); ctx.arc(tc.x, tc.y, 7, 0, Math.PI * 2); ctx.fill();
        }

        ctx.save(); ctx.translate(nave.x, nave.y); ctx.rotate(nave.tilt);
        ctx.fillStyle = '#00f3ff'; ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(-20, 20); ctx.lineTo(20, 20); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    function loop() {
      if (estado === 'JOGANDO') {
        atualizarJogo();
        desenharJogo();
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', function(e) {
      teclas[e.code] = true;
      if (e.code === 'Space') ativarSuperLaser();
      if (e.code === 'KeyP' || e.code === 'Escape') alternarPausa();
    });
    window.addEventListener('keyup', function(e) { teclas[e.code] = false; });

    function alternarPausa() {
      if (estado === 'JOGANDO') {
        estado = 'PAUSADO';
        document.getElementById('pause-screen').classList.remove('hidden');
      } else if (estado === 'PAUSADO') {
        estado = 'JOGANDO';
        document.getElementById('pause-screen').classList.add('hidden');
      }
    }

    document.getElementById('btn-pause').onclick = alternarPausa;
    document.getElementById('btn-resume').onclick = alternarPausa;

    function moverPonteiro(clientX, clientY) {
      var rect = c.getBoundingClientRect();
      alvoX = (clientX - rect.left) * (600 / rect.width);
      alvoY = (clientY - rect.top) * (760 / rect.height) - 35;
    }
    c.addEventListener('mousemove', function(e) { if (estado === 'JOGANDO') moverPonteiro(e.clientX, e.clientY); });
    c.addEventListener('touchstart', function(e) { tocando = true; var t = e.touches.item(0); if (t) moverPonteiro(t.clientX, t.clientY); }, { passive: true });
    c.addEventListener('touchmove', function(e) { if (tocando) { var t = e.touches.item(0); if (t) moverPonteiro(t.clientX, t.clientY); } }, { passive: true });

    function encerrarPartida(titulo, desc, acaoModo) {
      estado = 'MODAL'; modo = acaoModo;
      document.getElementById('m-tit').textContent = titulo;
      document.getElementById('m-desc').textContent = desc;
      document.getElementById('modal').classList.remove('hidden');
    }

    document.getElementById('btn-som').onclick = function() { mudo = !mudo; this.textContent = mudo ? 'MUDO' : 'SOM'; };
    document.getElementById('btn-ult').onclick = ativarSuperLaser;

    document.getElementById('btn-play').onclick = function() {
      document.getElementById('start-screen').classList.add('hidden');
      iniciarFase(1); estado = 'JOGANDO';
    };
    document.getElementById('btn-pause-menu').onclick = function() {
      document.getElementById('pause-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      estado = 'INICIO';
    };
    document.getElementById('btn-ok').onclick = function() {
      document.getElementById('modal').classList.add('hidden');
      iniciarFase(modo === 'PROX' ? fase + 1 : 1);
      estado = 'JOGANDO';
    };
    document.getElementById('btn-menu').onclick = function() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      estado = 'INICIO';
    };

    loop();
  </script>
</body>
</html>
