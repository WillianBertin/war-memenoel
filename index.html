<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>War Memenoel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #05060c;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-box {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 760px;
      border: 2px solid #00f3ff;
      border-radius: 16px;
      overflow: hidden;
      background-color: #080b1a;
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
    }
    .hp-bg {
      display: inline-block;
      width: 80px;
      height: 10px;
      background: #222;
      border-radius: 5px;
      overflow: hidden;
      vertical-align: middle;
      margin-left: 5px;
    }
    #hp-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
    }
    #btn-sound {
      pointer-events: auto;
      background: #112233;
      border: 1px solid #00f3ff;
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    #modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 18, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .card {
      background: #0d1428;
      border: 2px solid #00f3ff;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .card h2 {
      color: #ffcc00;
      font-size: 26px;
      margin-bottom: 10px;
    }
    .card p {
      color: #ccd6f6;
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    input[type="text"] {
      user-select: text;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #00f3ff;
      background: #050814;
      color: #fff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 14px;
      outline: none;
    }
    .btn-save {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff0055, #ff6600);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #record-info {
      margin-top: 12px;
      font-size: 12px;
      color: #00ff88;
    }
    #error-box {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: #cc0022;
      color: #fff;
      padding: 8px;
      font-size: 12px;
      border-radius: 8px;
      display: none;
      z-index: 100;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-box">
    <canvas id="canvas" width="600" height="760"></canvas>

    <div id="hud">
      <div>FASE <span id="txt-lvl" style="color:#ffcc00;">1</span>/20</div>
      <div>PTS <span id="txt-pts" style="color:#00f3ff;">0</span></div>
      <div>HP <span class="hp-bg"><span id="hp-bar" style="display:block;"></span></span></div>
      <button id="btn-sound" type="button">SOM</button>
    </div>

    <div id="modal" class="hidden">
      <div class="card">
        <h2 id="m-title">FASE CONCLUIDA!</h2>
        <p id="m-desc">Digite seu apelido de piloto para salvar:</p>
        <input type="text" id="inp-name" placeholder="Seu nome aqui" maxlength="14">
        <button id="btn-next" type="button" class="btn-save">SALVAR E CONTINUAR</button>
        <div id="record-info"></div>
      </div>
    </div>

    <div id="error-box"></div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      var eb = document.getElementById('error-box');
      eb.style.display = 'block';
      eb.textContent = 'Erro linha ' + line + ': ' + msg;
    };

    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');

    var estado = 'JOGANDO';
    var modoModal = 'PROXIMA';
    var fase = 1;
    var pontos = 0;
    var quadro = 0;
    var abatidos = 0;
    var chefeAtivo = false;
    var tremor = 0;
    var mudo = false;
    var audioCtx = null;

    var nave = { x: 300, y: 650, vel: 6.5, hp: 100, tiroTimer: 0, arma: 1 };
    var tiros = [];
    var tirosChefe = [];
    var inimigos = [];
    var itens = [];
    var particulas = [];
    var textos = [];
    var chefe = null;
    var teclas = {};
    var tocando = false;

    var estrelas = [];
    for (var i = 0; i < 90; i++) {
      estrelas.push({
        x: Math.random() * 600,
        y: Math.random() * 760,
        tam: Math.random() * 2.5 + 0.5,
        vel: Math.random() * 3 + 1
      });
    }

    function iniciarSom() {
      try {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function somTiro() {
      if (mudo || !audioCtx || audioCtx.state !== 'running') return;
      try {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(850, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
        g.gain.setValueAtTime(0.04, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function somExplosao() {
      if (mudo || !audioCtx || audioCtx.state !== 'running') return;
      try {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(160, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.2);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    function salvarDados() {
      try {
        var inp = document.getElementById('inp-name');
        var nome = inp.value.trim() || localStorage.getItem('wm_nome') || 'Piloto';
        localStorage.setItem('wm_nome', nome);
        var rec = JSON.parse(localStorage.getItem('wm_rec') || '{"f":1,"p":0}');
        var maxF = Math.max(rec.f || 1, fase);
        var maxP = Math.max(rec.p || 0, pontos);
        localStorage.setItem('wm_rec', JSON.stringify({ f: maxF, p: maxP }));
        document.getElementById('record-info').textContent = 'Recorde de ' + nome + ': Fase ' + maxF + ' - ' + maxP + ' pts';
      } catch (e) {}
    }

    function abrirModal(modo, titulo, desc, btnTexto) {
      estado = 'PAUSA';
      modoModal = modo;
      document.getElementById('m-title').textContent = titulo;
      document.getElementById('m-desc').textContent = desc;
      document.getElementById('btn-next').textContent = btnTexto;
      try {
        document.getElementById('inp-name').value = localStorage.getItem('wm_nome') || '';
      } catch (e) {}
      salvarDados();
      document.getElementById('modal').classList.remove('hidden');
      setTimeout(function() { document.getElementById('inp-name').focus(); }, 50);
    }

    function confirmarModal() {
      salvarDados();
      document.getElementById('modal').classList.add('hidden');
      if (modoModal === 'PROXIMA') {
        fase++;
        nave.hp = Math.min(100, nave.hp + 40);
      } else {
        fase = 1;
        pontos = 0;
        nave.hp = 100;
        nave.x = 300;
        nave.y = 650;
        nave.arma = 1;
      }
      prepararFase();
      estado = 'JOGANDO';
    }

    function prepararFase() {
      tiros = [];
      tirosChefe = [];
      inimigos = [];
      itens = [];
      abatidos = 0;
      chefeAtivo = false;
      chefe = null;
      textos.push({ x: 300, y: 360, txt: 'FASE ' + fase + ' / 20', cor: '#ffcc00', vida: 1.0 });
      atualizarHUD();
    }

    function explodir(x, y, cor, qtd) {
      for (var i = 0; i < qtd; i++) {
        var a = Math.random() * Math.PI * 2;
        var v = Math.random() * 5 + 1;
        particulas.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 1.0, cor: cor });
      }
    }

    function criarChefe() {
      chefeAtivo = true;
      tremor = 12;
      var vidaMax = 180 + (fase * 90);
      chefe = { x: 300, y: -100, alvoY: 150, hp: vidaMax, maxHp: vidaMax, dir: 1, vel: 2 + fase * 0.2, timer: 0 };
      textos.push({ x: 300, y: 230, txt: 'MEMENOEL CHEGANDO!', cor: '#ff0055', vida: 1.0 });
    }

    document.getElementById('btn-next').addEventListener('click', confirmarModal);
    document.getElementById('inp-name').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        confirmarModal();
      }
    });
    document.getElementById('btn-sound').addEventListener('click', function() {
      mudo = !mudo;
